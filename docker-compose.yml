services:
  web:
    image: chat-goblin-web
    build:
      context: ./web
    volumes:
      - ./web:/app
      # node_modules et .nuxt du conteneur (Linux) ne se mélangent pas avec ceux du poste (macOS)
      - /app/node_modules
      - /app/.nuxt
    ports:
      - 8080:8080
    environment:
      # API partagée de l'atelier (défaut : le serveur de la prof, voir web/nuxt.config.ts)
      - NUXT_PUBLIC_API_BASE=${NUXT_PUBLIC_API_BASE:-https://gobelins-chat-api.leomouraire.com:4000}
      # Qui peut créer et supprimer des salons, supprimer des comptes : pseudos séparés par des virgules
      - NUXT_PUBLIC_ADMIN_USERNAMES=${NUXT_PUBLIC_ADMIN_USERNAMES:-}
      # 1 = temps réel ; 3600 = une heure simulée dure une seconde (démo)
      - NUXT_PUBLIC_LETTER_TIME_SCALE=${NUXT_PUBLIC_LETTER_TIME_SCALE:-1}
